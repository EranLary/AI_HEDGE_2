name: Deploy to Fly

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then
            echo "No Fly token found. Set one of: FLY_API_TOKEN, FLY_TOKEN, or FLY_AUTH_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: flyctl version
        run: flyctl version

      - name: Deploy site app
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            flyctl deploy --remote-only --config fly.site.toml --app hedge-in-a-box-site && break
            n=$((n + 1))
            echo "Deploy site failed. Retry $n/3 in 20s..."
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "Site deployment failed after 3 attempts."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

  deploy-obs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then
            echo "No Fly token found. Set one of: FLY_API_TOKEN, FLY_TOKEN, or FLY_AUTH_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Skip if obs app does not exist yet
        id: obs_exists
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          if flyctl status --app hedge-in-a-box-obs >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Obs app not yet created on Fly. Skipping deploy. Run 'flyctl apps create hedge-in-a-box-obs' once to enable."
          fi

      - name: Deploy obs app
        if: steps.obs_exists.outputs.exists == 'true'
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            flyctl deploy --remote-only --config fly.obs.toml --app hedge-in-a-box-obs && break
            n=$((n + 1))
            echo "Deploy obs failed. Retry $n/3 in 20s..."
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "Obs deployment failed after 3 attempts."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

  deploy-nasdaq-worker:
    needs: deploy-site
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then
            echo "No Fly token found. Set one of: FLY_API_TOKEN, FLY_TOKEN, or FLY_AUTH_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Check worker app
        id: worker_exists
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          if flyctl status --app hedge-in-a-box-nasdaq-worker >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nasdaq worker app does not exist yet; skipping deploy. See docs/nasdaq100-workspace.md."
          fi

      - name: Deploy Nasdaq worker
        if: steps.worker_exists.outputs.exists == 'true'
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: flyctl deploy --remote-only --ha=false --config fly.nasdaq-worker.toml --app hedge-in-a-box-nasdaq-worker
