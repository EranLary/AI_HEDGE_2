name: Deploy to Fly

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_AUTH_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.FLY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        run: |
          if [ -z "$FLY_AUTH_TOKEN" ]; then
            echo "No Fly token found. Set either FLY_API_TOKEN or FLY_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: flyctl version
        run: flyctl version

      - name: Deploy bot app
        run: flyctl deploy --remote-only --config fly.toml --app ai-hedge-telegram-bot
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_AUTH_TOKEN: ${{ secrets.FLY_API_TOKEN || secrets.FLY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        run: |
          if [ -z "$FLY_AUTH_TOKEN" ]; then
            echo "No Fly token found. Set either FLY_API_TOKEN or FLY_TOKEN in GitHub Actions secrets."
            exit 1
          fi

      - name: flyctl version
        run: flyctl version

      - name: Deploy site app
        run: flyctl deploy --remote-only --config fly.site.toml --app hedge-in-a-box-site
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
