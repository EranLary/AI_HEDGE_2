name: Deploy to Fly

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-$FLY_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Fly token found. Set either FLY_API_TOKEN or FLY_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: flyctl version
        run: flyctl version

      - name: Validate Fly auth
        run: flyctl auth whoami
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

      - name: Deploy bot app
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            flyctl deploy --remote-only --config fly.toml --app ai-hedge-telegram-bot && break
            n=$((n + 1))
            echo "Deploy bot failed. Retry $n/3 in 20s..."
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "Bot deployment failed after 3 attempts."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

  deploy-site:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Validate Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-$FLY_TOKEN}"
          if [ -z "$TOKEN" ]; then
            echo "No Fly token found. Set either FLY_API_TOKEN or FLY_TOKEN in GitHub Actions secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: flyctl version
        run: flyctl version

      - name: Validate Fly auth
        run: flyctl auth whoami
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}

      - name: Deploy site app
        run: |
          n=0
          until [ "$n" -ge 3 ]
          do
            flyctl deploy --remote-only --config fly.site.toml --app hedge-in-a-box-site && break
            n=$((n + 1))
            echo "Deploy site failed. Retry $n/3 in 20s..."
            sleep 20
          done
          if [ "$n" -ge 3 ]; then
            echo "Site deployment failed after 3 attempts."
            exit 1
          fi
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          FLY_ACCESS_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
