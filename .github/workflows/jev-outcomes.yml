name: Jev outcomes

on:
  schedule:
    - cron: '20 2 * * 2-6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jev-outcomes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Validate database secret
        run: test -n "$DATABASE_URL_UNPOOLED"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resolve matured Jev predictions
        run: python scripts/db/refresh_jev_outcomes.py --workspace all
