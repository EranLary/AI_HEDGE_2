name: Portfolio Performance Refresh

on:
  schedule:
    # Tuesday-Saturday UTC = Monday-Friday US sessions. Waiting until 21:30 ET
    # gives Yahoo several hours to publish the just-closed session.
    - cron: '30 1 * * 2-6'
  workflow_dispatch:
    inputs:
      track:
        description: Portfolio track to refresh
        type: choice
        required: true
        default: paper
        options:
          - paper
          - backtest
      workspace:
        description: Workspace to refresh
        type: choice
        required: true
        default: all
        options:
          - all
          - analysis
          - nasdaq100
      through:
        description: Optional inclusive end date (YYYY-MM-DD)
        type: string
        required: false
      paper_cutoff:
        description: Optional Paper cutoff to create or repair (YYYY-MM-DD)
        type: string
        required: false
      start_cutoff:
        description: Backtest first month-end cutoff (YYYY-MM-DD)
        type: string
        required: false
        default: '2026-04-30'
      replace_backtest:
        description: Explicitly replace the selected backtest methodology version
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: portfolio-performance-${{ github.event.inputs.workspace || 'all' }}-${{ github.event.inputs.track || 'paper' }}
  cancel-in-progress: false

env:
  FLY_APP: hedge-in-a-box-site

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolve Fly token
        env:
          FLY_API_TOKEN_PRIMARY: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN_PRIMARY:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Fly token found. Set FLY_API_TOKEN in repo secrets."
            exit 1
          fi
          echo "FLY_API_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Refresh portfolio data inside Fly
        env:
          INPUT_TRACK: ${{ github.event.inputs.track }}
          INPUT_WORKSPACE: ${{ github.event.inputs.workspace }}
          INPUT_THROUGH: ${{ github.event.inputs.through }}
          INPUT_PAPER_CUTOFF: ${{ github.event.inputs.paper_cutoff }}
          INPUT_START_CUTOFF: ${{ github.event.inputs.start_cutoff }}
          INPUT_REPLACE: ${{ github.event.inputs.replace_backtest }}
        run: |
          set -euo pipefail
          TRACK="${INPUT_TRACK:-paper}"
          if [ "$TRACK" != "paper" ] && [ "$TRACK" != "backtest" ]; then
            echo "::error::track must be paper or backtest"
            exit 1
          fi
          WORKSPACE="${INPUT_WORKSPACE:-all}"
          if [ "$WORKSPACE" = "all" ]; then
            WORKSPACES="analysis nasdaq100"
          elif [ "$WORKSPACE" = "analysis" ] || [ "$WORKSPACE" = "nasdaq100" ]; then
            WORKSPACES="$WORKSPACE"
          else
            echo "::error::workspace must be all, analysis, or nasdaq100"
            exit 1
          fi
          if [ -n "${INPUT_THROUGH:-}" ] && ! [[ "$INPUT_THROUGH" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::through must use YYYY-MM-DD"
            exit 1
          fi
          if [ "$TRACK" = "paper" ]; then
            if [ -n "${INPUT_PAPER_CUTOFF:-}" ]; then
              if ! [[ "$INPUT_PAPER_CUTOFF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
                echo "::error::paper_cutoff must use YYYY-MM-DD"
                exit 1
              fi
            fi
          else
            if [ -n "${INPUT_PAPER_CUTOFF:-}" ]; then
              echo "::error::paper_cutoff is only valid for the paper track"
              exit 1
            fi
            START_CUTOFF="${INPUT_START_CUTOFF:-2026-04-30}"
            if ! [[ "$START_CUTOFF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
              echo "::error::start_cutoff must use YYYY-MM-DD"
              exit 1
            fi
          fi
          FAILURES=()
          for TARGET_WORKSPACE in $WORKSPACES; do
            COMMAND="cd /app/frontend && npm run portfolio:refresh -- --workspace $TARGET_WORKSPACE --track $TRACK"
            if [ -n "${INPUT_THROUGH:-}" ]; then
              COMMAND="$COMMAND --through $INPUT_THROUGH"
            fi
            if [ "$TRACK" = "paper" ] && [ -n "${INPUT_PAPER_CUTOFF:-}" ]; then
              COMMAND="$COMMAND --paper-cutoff $INPUT_PAPER_CUTOFF"
            fi
            if [ "$TRACK" = "backtest" ]; then
              COMMAND="$COMMAND --start-cutoff $START_CUTOFF"
              if [ "${INPUT_REPLACE:-false}" = "true" ]; then
                COMMAND="$COMMAND --replace-backtest"
              fi
            fi
            if ! flyctl ssh console --app "$FLY_APP" --command "sh -lc '$COMMAND'"; then
              echo "::error::$TARGET_WORKSPACE/$TRACK refresh failed; remaining workspaces will still run."
              FAILURES+=("$TARGET_WORKSPACE/$TRACK")
            fi
          done
          if [ "${#FAILURES[@]}" -gt 0 ]; then
            echo "::error::Portfolio refresh failures: ${FAILURES[*]}"
            exit 1
          fi

      - name: Refresh backtest alongside scheduled paper tracking
        if: github.event_name == 'schedule' && always()
        run: |
          set -euo pipefail
          FAILURES=()
          for TARGET_WORKSPACE in analysis nasdaq100; do
            if ! flyctl ssh console --app "$FLY_APP" --command \
              "sh -lc 'cd /app/frontend && npm run portfolio:refresh -- --workspace $TARGET_WORKSPACE --track backtest --start-cutoff 2026-04-30'"; then
              echo "::error::$TARGET_WORKSPACE/backtest refresh failed; remaining workspaces will still run."
              FAILURES+=("$TARGET_WORKSPACE/backtest")
            fi
          done
          if [ "${#FAILURES[@]}" -gt 0 ]; then
            echo "::error::Portfolio backtest refresh failures: ${FAILURES[*]}"
            exit 1
          fi
