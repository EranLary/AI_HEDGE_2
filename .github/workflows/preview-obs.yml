name: Obs Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - 'frontend-obs/**'
      - 'Dockerfile.obs'
      - 'fly.obs.toml'
      - '.github/workflows/preview-obs.yml'

permissions:
  contents: read

concurrency:
  group: preview-obs-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  FLY_REGION: fra
  FLY_ORG: ${{ vars.FLY_ORG || 'personal' }}
  PREVIEW_APP: pr-${{ github.event.pull_request.number }}-hedge-in-a-box-obs
  NEON_BRANCH_NAME: pr-${{ github.event.pull_request.number }}
  NEON_PARENT_BRANCH: production

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Resolve Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then
            echo "::error::No Fly token found. Set FLY_API_TOKEN in repo secrets."
            exit 1
          fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Generate preview fly.toml
        run: |
          # Swap app name + force auto-stop / zero idle machines so previews are free when nobody is poking them.
          sed \
            -e 's/^app = "hedge-in-a-box-obs"/app = "${{ env.PREVIEW_APP }}"/' \
            -e 's/auto_stop_machines = false/auto_stop_machines = "stop"/' \
            -e 's/min_machines_running = 1/min_machines_running = 0/' \
            fly.obs.toml > fly.obs.preview.toml
          echo '--- fly.obs.preview.toml ---'
          cat fly.obs.preview.toml

      - name: Ensure preview app exists
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          if flyctl apps list --json | jq -e --arg n "${{ env.PREVIEW_APP }}" '.[] | select((.Name // .name)==$n)' >/dev/null; then
            echo "App ${{ env.PREVIEW_APP }} exists — reusing."
          else
            flyctl apps create "${{ env.PREVIEW_APP }}" --org "${{ env.FLY_ORG }}"
          fi

      - name: Create or reuse Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID_OBS }}
        run: |
          set -euo pipefail
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "::error::NEON_API_KEY and NEON_PROJECT_ID_OBS must be set."
            exit 1
          fi

          npm install -g neonctl@latest >/dev/null

          if neonctl branches list --project-id "$NEON_PROJECT_ID" --output json \
             | jq -e --arg n "$NEON_BRANCH_NAME" '.[] | select(.name==$n)' >/dev/null; then
            echo "Reusing existing Neon branch $NEON_BRANCH_NAME"
          else
            echo "Creating Neon branch $NEON_BRANCH_NAME off $NEON_PARENT_BRANCH"
            neonctl branches create \
              --project-id "$NEON_PROJECT_ID" \
              --name "$NEON_BRANCH_NAME" \
              --parent "$NEON_PARENT_BRANCH" \
              >/dev/null 2>&1
          fi

          UNPOOLED=$(neonctl connection-string "$NEON_BRANCH_NAME" --project-id "$NEON_PROJECT_ID")
          echo "::add-mask::$UNPOOLED"
          echo "PR_OBS_DATABASE_URL=$UNPOOLED" >> "$GITHUB_ENV"

      - name: Stage preview secrets
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
          OBS_DATABASE_URL: ${{ env.PR_OBS_DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        run: |
          args=(
            "AUTH_BYPASS_PREVIEW=1"
          )
          if [ -z "$OBS_DATABASE_URL" ]; then
            echo "::error::PR_OBS_DATABASE_URL not produced by Neon branch step."
            exit 1
          else
            args+=("OBS_DATABASE_URL=$OBS_DATABASE_URL")
          fi
          if [ -z "$AUTH_SECRET" ]; then
            generated_auth_secret="$(openssl rand -hex 32)"
            echo "::warning::AUTH_SECRET secret not set - generating ephemeral secret for this preview app."
            args+=("AUTH_SECRET=$generated_auth_secret")
          else
            args+=("AUTH_SECRET=$AUTH_SECRET")
          fi
          flyctl secrets set "${args[@]}" --app "${{ env.PREVIEW_APP }}" --stage

      - name: Deploy preview
        id: deploy
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          flyctl deploy --remote-only \
            --config fly.obs.preview.toml \
            --app "${{ env.PREVIEW_APP }}" \
            --ha=false \
            --wait-timeout 5m

      - name: Diagnostics on deploy failure
        if: failure() && steps.deploy.conclusion == 'failure'
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          set +e
          echo '::group::flyctl status'
          flyctl status --app "${{ env.PREVIEW_APP }}"
          echo '::endgroup::'

          echo '::group::flyctl machines list'
          flyctl machines list --app "${{ env.PREVIEW_APP }}"
          echo '::endgroup::'

          echo '::group::recent logs (30s tail)'
          timeout 30 flyctl logs --app "${{ env.PREVIEW_APP }}" || true
          echo '::endgroup::'

      - name: Publish preview summary
        run: |
          echo "::notice title=Obs preview::https://${PREVIEW_APP}.fly.dev"
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Obs preview deployed

          **URL:** https://${PREVIEW_APP}.fly.dev

          ⚠️ **Auth is bypassed on previews** — Google OAuth doesn't allow wildcard
          redirect URIs for \`pr-*\` hostnames, so the preview hands out admin access
          to anyone with the URL. Don't share it externally.

          - DB is a Neon branch (\`${NEON_BRANCH_NAME}\`) off prod's \`${NEON_PARENT_BRANCH}\` — safe to mutate.
          - Machine auto-stops when idle, auto-starts on request.
          - Tear-down (Fly app + Neon branch) runs automatically when this PR is closed.
          EOF

  teardown:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Resolve Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_TOKEN: ${{ secrets.FLY_TOKEN }}
          FLY_AUTH_TOKEN_INPUT: ${{ secrets.FLY_AUTH_TOKEN }}
        run: |
          TOKEN="${FLY_API_TOKEN:-${FLY_TOKEN:-$FLY_AUTH_TOKEN_INPUT}}"
          if [ -z "$TOKEN" ]; then echo "::error::No Fly token found"; exit 1; fi
          echo "FLY_AUTH_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Destroy preview app
        env:
          FLY_API_TOKEN: ${{ env.FLY_AUTH_TOKEN }}
        run: |
          if flyctl apps list --json | jq -e --arg n "${{ env.PREVIEW_APP }}" '.[] | select((.Name // .name)==$n)' >/dev/null; then
            flyctl apps destroy "${{ env.PREVIEW_APP }}" --yes
          else
            echo "App ${{ env.PREVIEW_APP }} already gone — nothing to destroy."
          fi

      - name: Delete Neon branch
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID_OBS }}
        run: |
          set -euo pipefail
          if [ -z "$NEON_API_KEY" ] || [ -z "$NEON_PROJECT_ID" ]; then
            echo "Neon credentials missing — skipping branch delete."
            exit 0
          fi
          npm install -g neonctl@latest >/dev/null
          if neonctl branches list --project-id "$NEON_PROJECT_ID" --output json \
             | jq -e --arg n "$NEON_BRANCH_NAME" '.[] | select(.name==$n)' >/dev/null; then
            echo "Deleting Neon branch $NEON_BRANCH_NAME"
            neonctl branches delete "$NEON_BRANCH_NAME" --project-id "$NEON_PROJECT_ID" >/dev/null
          else
            echo "Neon branch $NEON_BRANCH_NAME already gone — nothing to delete."
          fi

      - name: Publish teardown summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ### Obs preview torn down

          The preview environment for this PR has been destroyed.
          EOF
