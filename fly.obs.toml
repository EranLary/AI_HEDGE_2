app = "hedge-in-a-box-obs"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "1m0s"

[build]
  dockerfile = "Dockerfile.obs"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024
