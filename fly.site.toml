app = "hedge-in-a-box-site"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "1m0s"

[build]
  dockerfile = "Dockerfile.site"

[deploy]
  # Apply any pending SQL migrations before traffic is shifted to the new image.
  # Runs in a one-off ephemeral machine; idempotent — see scripts/migrate.py.
  release_command = "python3 /app/scripts/migrate.py"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  PYTHONUNBUFFERED = "1"
  PYTHON_EXECUTABLE = "python3"
  # Paper control plane only. AUTH_BYPASS_PREVIEW forces all mutations off in PR previews.
  TRADING_CONTROL_ENABLED = "1"
  IBKR_LIVE_TRADING_ENABLED = "0"

[[mounts]]
  source = "site_data_fra"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
