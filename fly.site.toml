app = "hedge-in-a-box-site"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "1m0s"

[build]
  dockerfile = "Dockerfile.site"

[env]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_ENV = "production"
  PYTHONUNBUFFERED = "1"
  PYTHON_EXECUTABLE = "python3"

[[mounts]]
  source = "site_data_fra"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048
