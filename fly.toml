app = "ai-hedge-telegram-bot"
primary_region = "fra"
kill_signal = "SIGINT"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONUNBUFFERED = "1"
  BOT_MAX_WORKERS = "1"

[vm]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 2048

[[mounts]]
  source = "bot_data_fra"
  destination = "/data"
