<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Waking up…</title>
    <style>
      :root {
        --bg: #0b1220;
        --fg: #e2e8f0;
        --muted: rgba(148, 163, 184, 0.7);
        --accent: #60a5fa;
        --border: rgba(148, 163, 184, 0.18);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f8fafc;
          --fg: #0f172a;
          --muted: rgba(15, 23, 42, 0.6);
          --accent: #2563eb;
          --border: rgba(15, 23, 42, 0.12);
        }
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--fg);
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
      }
      header {
        padding: 14px 24px;
        border-bottom: 1px solid var(--border);
        font-weight: 600;
        font-size: 14px;
        letter-spacing: 0.2px;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        text-align: center;
        max-width: 380px;
        width: 100%;
      }
      h1 {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }
      .bar {
        height: 3px;
        width: 100%;
        background: var(--border);
        border-radius: 999px;
        overflow: hidden;
        position: relative;
      }
      .bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        height: 100%;
        width: 35%;
        background: linear-gradient(90deg, transparent 0%, var(--accent) 50%, transparent 100%);
        animation: slide 1.1s ease-in-out infinite;
      }
      @keyframes slide {
        0%   { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .bar::before { animation-duration: 2.5s; }
      }
      .hint {
        margin-top: 18px;
        font-size: 11px;
        color: var(--muted);
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <header>Observability</header>
    <main>
      <div class="card">
        <h1>Waking up the server…</h1>
        <p>The obs app scales to zero when idle. This usually takes a few seconds.</p>
        <div class="bar" role="progressbar" aria-label="Server warming up" aria-busy="true"></div>
        <div class="hint" id="hint">Checking…</div>
      </div>
    </main>
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var next = params.get("next") || "/";
        // Only redirect to same-origin paths.
        if (!next.startsWith("/") || next.startsWith("//")) next = "/";

        var pollMs = 300;
        var timeoutMs = 45000;
        var started = Date.now();
        var hint = document.getElementById("hint");

        function tick() {
          var elapsed = Date.now() - started;
          if (elapsed > timeoutMs) {
            if (hint) hint.textContent = "Still warming up. Trying anyway…";
            window.location.replace(next);
            return;
          }
          if (hint && elapsed > 4000) {
            hint.textContent = "Still booting (" + Math.floor(elapsed / 1000) + "s)…";
          }
          fetch("/api/health", { cache: "no-store", credentials: "same-origin" })
            .then(function (r) {
              if (r && r.ok) {
                window.location.replace(next);
              } else {
                setTimeout(tick, pollMs);
              }
            })
            .catch(function () {
              setTimeout(tick, pollMs);
            });
        }
        tick();
      })();
    </script>
  </body>
</html>
